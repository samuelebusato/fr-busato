# Deploy automatico su S3 + CloudFront a ogni push su main.
# Autenticazione via OIDC: nessuna access key salvata su GitHub.
# Richiede 3 secret di repo (Settings → Secrets and variables → Actions):
#   AWS_ROLE_ARN                 arn del ruolo IAM assunto via OIDC
#   S3_BUCKET                    nome del bucket (es. fr-busato-sito)
#   CLOUDFRONT_DISTRIBUTION_ID   id della distribuzione (es. E1A2B3C4D5E6F7)
# Setup completo lato AWS: docs/deploy-aws.md §8.

name: Deploy su S3 + CloudFront

on:
  push:
    branches: [main]

permissions:
  id-token: write   # necessario per OIDC verso AWS
  contents: read

concurrency:
  group: deploy-sito
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Credenziali AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # L'ARN di un ruolo non è un segreto: la protezione sta nella trust
          # policy, che accetta solo token OIDC di questa repo sul branch main.
          role-to-assume: arn:aws:iam::219712358948:role/github-deploy-fr-busato
          aws-region: eu-central-1

      # Cache-Control su ogni file. Senza, i browser tengono JS e CSS per un tempo stimato da
      # loro e una modifica può restare invisibile per ore a chi ha già visitato il sito.
      # max-age=0, must-revalidate: il browser ricontrolla ogni volta (risposta 304 se il
      # file non è cambiato). s-maxage=86400: CloudFront tiene la sua copia un giorno, e
      # l'invalidazione qui sotto la svuota a ogni rilascio.
      # Il checkout dà a ogni file una data nuova, quindi sync li ricarica tutti con l'header.
      - name: Sync dei file su S3
        run: |
          aws s3 sync . "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --cache-control "public, max-age=0, must-revalidate, s-maxage=86400" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "docs/*" \
            --exclude "README.md"

      - name: Invalidazione cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

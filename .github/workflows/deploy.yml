# Deploy automatico su S3 + CloudFront a ogni push su main.
# Autenticazione via OIDC: nessuna access key salvata su GitHub.
# Richiede 3 secret di repo (Settings → Secrets and variables → Actions):
#   AWS_ROLE_ARN                 arn del ruolo IAM assunto via OIDC
#   S3_BUCKET                    nome del bucket (es. fr-busato-sito)
#   CLOUDFRONT_DISTRIBUTION_ID   id della distribuzione (es. E1A2B3C4D5E6F7)
# Setup completo lato AWS: docs/deploy-aws.md §8.

name: Deploy su S3 + CloudFront

on:
  push:
    branches: [main]

permissions:
  id-token: write   # necessario per OIDC verso AWS
  contents: read

concurrency:
  group: deploy-sito
  cancel-in-progress: true

jobs:
  # Prima, il controllo dei segreti e dei dati (segreti-dati.yml): se fallisce, il sito non si pubblica.
  segreti-dati:
    uses: ./.github/workflows/segreti-dati.yml
    permissions:
      contents: read

  deploy:
    needs: segreti-dati
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Credenziali AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # L'ARN di un ruolo non è un segreto: la protezione sta nella trust
          # policy, che accetta solo token OIDC di questa repo sul branch main.
          role-to-assume: arn:aws:iam::219712358948:role/github-deploy-fr-busato
          aws-region: eu-central-1

      # Cache-Control su ogni file. Senza, i browser tengono JS e CSS per un tempo stimato da
      # loro e una modifica può restare invisibile per ore a chi ha già visitato il sito.
      # max-age=0, must-revalidate: il browser ricontrolla ogni volta (risposta 304 se il
      # file non è cambiato). s-maxage=86400: CloudFront tiene la sua copia un giorno, e
      # l'invalidazione qui sotto la svuota a ogni rilascio.
      # Il checkout dà a ogni file una data nuova, quindi sync li ricarica tutti con l'header.
      #
      # FUORI è l'unico elenco di ciò che non va sul sito: diventa le esclusioni del sync e, dopo,
      # i file da togliere dal bucket. Le esclusioni impediscono di caricare, non cancellano ciò
      # che c'era già: README.md e docs/deploy-aws.md, caricati il 2026-07-30, prima del deploy
      # automatico, sono stati serviti fino al 2026-11-18. La brochure (sorgente e PDF) si
      # distribuisce a mano; REVISIONI.md è del repository, non di chi visita.
      # set -f: senza, la shell espande docs/* sui file del checkout invece di passarlo ad aws.
      - name: Sync dei file su S3
        shell: bash
        env:
          FUORI: ".git/* .github/* docs/* brochure/* README.md REVISIONI.md"
        run: |
          set -f
          esclusi=(); compresi=()
          for p in $FUORI; do esclusi+=(--exclude "$p"); compresi+=(--include "$p"); done
          set +f
          aws s3 sync . "s3://${{ secrets.S3_BUCKET }}" \
            --delete \
            --cache-control "public, max-age=0, must-revalidate, s-maxage=86400" \
            "${esclusi[@]}"
          # --dryrun al primo giro: il log dice che cosa toglierebbe, senza toglierlo (2026-11-18).
          aws s3 rm "s3://${{ secrets.S3_BUCKET }}" --recursive --dryrun \
            --exclude "*" "${compresi[@]}"

      - name: Invalidazione cache CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
